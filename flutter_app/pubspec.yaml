name: tayyibat
description: تطبيق الطيبات — متابعة غذائية واعية (نسخة Flutter).
publish_to: 'none'
version: 1.1.0+7

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned to match what flutter_localizations expects on Flutter 3.5.
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  # Crash reporting is temporarily disabled in v1.0.2 — sentry_flutter
  # 8.14.2's iOS Swift bridge references SentryBinaryImageCache.image
  # which the current Sentry-Cocoa pod no longer exposes, breaking
  # archive on Xcode. Will be re-added in v1.0.3 with sentry_flutter
  # 9.x (which fixes the bridge). The plumbing in main.dart and
  # config.dart stays — it short-circuits when no DSN is provided so
  # is a no-op regardless of whether the package is present.
  # sentry_flutter: ^9.21.0   # uncomment in v1.0.3

  # الواجهة الخلفية
  supabase_flutter: ^2.5.6
  http: ^1.2.0

  # التقاط الصور
  image_picker: ^1.1.1

  # التخزين المحلي
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.4.0
  shared_preferences: ^2.3.2

  # إدارة الحالة
  provider: ^6.1.2

  # المصادقة عبر مزوّدي OAuth
  app_links: ^6.3.2          # يلتقط روابط الـ OAuth العائدة (tayyibat://login-callback)
  sign_in_with_apple: ^6.1.4 # تسجيل الدخول الأصلي عبر Apple (iOS؛ معطّل افتراضياً حتى عضوية Developer)
  crypto: ^3.0.5             # SHA-256 لتوليد nonce لـ Apple

  # الإشعارات المحلية (تذكيرات وجبات / نصائح / نهاية اليوم)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # التقويم الهجري لميزة الصيام
  hijri: ^3.0.0

  # تقويم شهري في تبويب السجل
  table_calendar: ^3.1.2

  # رسوم بيانية في Body Intelligence
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # In-memory SQLite for unit-testing schema migrations and repositories.
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true        # enables Flutter's gen-l10n from arb files
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  background_color_ios: "#0F5132"
  adaptive_icon_background: "#0F5132"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
