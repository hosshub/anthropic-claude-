# nginx reverse proxy لـ api.tayyibat.ai → خدمة Node على المنفذ 8787
# انسخه إلى /etc/nginx/sites-available/ وفعّله، ثم أصدر شهادة:
#   sudo certbot --nginx -d api.tayyibat.ai

server {
    listen 80;
    listen [::]:80;
    server_name api.tayyibat.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tayyibat.ai;

    # سيملأ certbot هذين السطرين تلقائياً:
    ssl_certificate     /etc/letsencrypt/live/api.tayyibat.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tayyibat.ai/privkey.pem;

    # صور الوجبات بصيغة base64 قد تصل لبضعة ميجابايت.
    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
